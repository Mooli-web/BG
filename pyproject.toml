[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg-rl"
version = "0.1.0"
description = "A self-play PPO backgammon agent with a pygame human interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pygame>=2.5,<3",
    "torch>=2.2",
]

[project.scripts]
bg = "bg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
